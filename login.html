<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login — Pick&Pack | Gifts that get them</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==========================================================================
       NAVIGATION BAR
       ========================================================================== -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🎁</span>
        <div>
          <span>Pick&Pack</span>
          <span class="brand-tagline">Gifts that get them</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">← Back to Shop</a></li>
      </ul>
    </div>
  </nav>

  <!-- ==========================================================================
       LOGIN & SIGNUP MAIN CONTAINER
       ========================================================================== -->
  <main style="padding: 60px 20px; display: flex; align-items: center; justify-content: center; flex-grow: 1;">
    <div style="background: white; width: 100%; max-width: 460px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); padding: 36px 32px;">
      
      <!-- Logo & Heading -->
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.5rem; display: inline-block; margin-bottom: 8px;">🎁</span>
        <h2 style="font-size: 1.8rem; color: var(--navy); margin-bottom: 4px;">Welcome to Pick&Pack</h2>
        <p style="font-size: 0.88rem; color: var(--navy-muted);">Save recipients, track gift bundles & checkout faster</p>
      </div>

      <!-- Quick Demo Login Bar -->
      <div style="background: var(--cream-soft); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px; border: 1px dashed var(--border);">
        <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--coral-dark); display: block; margin-bottom: 8px;">
          ⚡ Instant Demo Login:
        </span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" id="btn-demo-shopper" style="flex: 1;">
            👤 Demo Shopper
          </button>
          <button class="btn btn-secondary btn-sm" id="btn-demo-admin" style="flex: 1;">
            ⚙️ Demo Admin
          </button>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div style="display: flex; border-bottom: 2px solid var(--border-light); margin-bottom: 24px;">
        <button id="tab-login" class="nav-link active" style="flex: 1; text-align: center; justify-content: center; border-radius: 0; border-bottom: 2px solid var(--coral); margin-bottom: -2px;">
          Sign In
        </button>
        <button id="tab-signup" class="nav-link" style="flex: 1; text-align: center; justify-content: center; border-radius: 0; margin-bottom: -2px;">
          Create Account
        </button>
      </div>

      <!-- Sign In Form -->
      <form id="form-login" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" value="ananya@example.com" required>
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="login-password">Password</label>
            <span style="font-size: 0.78rem; color: var(--coral); cursor: pointer;" onclick="showToast('Use demo password: password123', 'info')">Forgot?</span>
          </div>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="password123" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-submit-login" style="margin-top: 14px;">
          Sign In to Pick&Pack
        </button>
      </form>

      <!-- Sign Up Form (hidden initially) -->
      <form id="form-signup" style="display: none;" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Maya Sharma" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="form-input" placeholder="maya@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-submit-signup" style="margin-top: 14px;">
          Create Free Account
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <span>&copy; 2026 Pick&Pack. All rights reserved.</span>
      <a href="index.html" style="color: var(--coral);">Back to Shop</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tabLogin = document.getElementById("tab-login");
      const tabSignup = document.getElementById("tab-signup");
      const formLogin = document.getElementById("form-login");
      const formSignup = document.getElementById("form-signup");

      tabLogin.addEventListener("click", () => {
        tabLogin.classList.add("active");
        tabLogin.style.borderBottom = "2px solid var(--coral)";
        tabSignup.classList.remove("active");
        tabSignup.style.borderBottom = "none";
        formLogin.style.display = "block";
        formSignup.style.display = "none";
      });

      tabSignup.addEventListener("click", () => {
        tabSignup.classList.add("active");
        tabSignup.style.borderBottom = "2px solid var(--coral)";
        tabLogin.classList.remove("active");
        tabLogin.style.borderBottom = "none";
        formSignup.style.display = "block";
        formLogin.style.display = "none";
      });

      // Quick Demo Buttons
      document.getElementById("btn-demo-shopper").addEventListener("click", () => {
        setUser({
          name: "Ananya Roy",
          email: "ananya@example.com",
          role: "shopper"
        });
        showToast("Logged in as Ananya Roy (Shopper)!", "success");
        setTimeout(() => window.location.href = "index.html", 600);
      });

      document.getElementById("btn-demo-admin").addEventListener("click", () => {
        setUser({
          name: "Administrator",
          email: "admin@pickandpack.com",
          role: "admin"
        });
        showToast("Logged in as Admin!", "success");
        setTimeout(() => window.location.href = "admin.html", 600);
      });

      // Login Form Submit
      formLogin.addEventListener("submit", () => {
        const email = document.getElementById("login-email").value.trim();
        const pwd = document.getElementById("login-password").value;

        if (!email || !pwd) {
          showToast("Please fill in both email and password", "warning");
          return;
        }

        const name = email.split("@")[0].replace(".", " ");
        const capitalized = name.charAt(0).toUpperCase() + name.slice(1);

        setUser({
          name: capitalized,
          email: email,
          role: email.includes("admin") ? "admin" : "shopper"
        });

        showToast(`Welcome back, ${capitalized}!`, "success");
        setTimeout(() => {
          if (email.includes("admin")) {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }
        }, 700);
      });

      // Signup Form Submit
      formSignup.addEventListener("submit", () => {
        const name = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const pwd = document.getElementById("signup-password").value;

        if (!name || !email || !pwd) {
          showToast("Please fill in all signup details", "warning");
          return;
        }
        if (pwd.length < 6) {
          showToast("Password must be at least 6 characters", "warning");
          return;
        }

        setUser({
          name: name,
          email: email,
          role: "shopper"
        });

        showToast(`Account created! Welcome to Pick&Pack, ${name}!`, "success");
        setTimeout(() => window.location.href = "index.html", 700);
      });
    });
  </script>
</body>
</html>
